server {
  listen 80;
  root /usr/share/nginx/html;

  # Resolve upstreams at request time (Docker DNS), so a recreated backend container with a new IP is found
  # again without restarting this one. Variables in proxy_pass disable URI rewriting, hence the explicit rewrite.
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $core http://core-api:8000;
  set $erp http://erp-adapter-api:8000;
  set $mocksap http://mock-sap:8000;
  set $itsm http://itsm-adapter-api:8000;
  set $agent http://support-agent-api:8000;
  set $notify http://notifier-api:8000;

  # HTTP/1.1 + long read timeout: the live board keeps a server-sent-events stream open
  location /api/core/ {
    rewrite ^/api/core/(.*)$ /$1 break;
    proxy_pass $core;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header X-Request-ID $request_id;
    proxy_read_timeout 3600s;
  }
  location /api/erp/ {
    rewrite ^/api/erp/(.*)$ /$1 break;
    proxy_pass $erp;
    proxy_set_header X-Request-ID $request_id;
  }
  location /api/itsm/ {
    rewrite ^/api/itsm/(.*)$ /$1 break;
    proxy_pass $itsm;
    proxy_set_header X-Request-ID $request_id;
  }
  # the AI support agent: chat answers stream as server-sent events, so no buffering and a long read timeout
  location /api/agent/ {
    client_max_body_size 25m;  # knowledge uploads (OEM manuals up to 20 MB)
    rewrite ^/api/agent/(.*)$ /$1 break;
    proxy_pass $agent;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header X-Request-ID $request_id;
    proxy_buffering off;
    proxy_read_timeout 600s;
  }
  location /api/notify/ {
    rewrite ^/api/notify/(.*)$ /$1 break;
    proxy_pass $notify;
    proxy_set_header X-Request-ID $request_id;
  }
  location /api/mock-sap/ {
    rewrite ^/api/mock-sap/(.*)$ /$1 break;
    proxy_pass $mocksap;
    proxy_read_timeout 60s;
  }

  location / { try_files $uri /index.html; }
}
