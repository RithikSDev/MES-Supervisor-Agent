server {
  listen 80;
  root /usr/share/nginx/html;

  # Resolve the API at request time (Docker DNS): a recreated core-api container is found again.
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $core http://core-api:8000;
  set $agent http://support-agent-api:8000;

  location /api/core/ {
    rewrite ^/api/core/(.*)$ /$1 break;
    proxy_pass $core;
    proxy_set_header X-Request-ID $request_id;
  }
  # the AI support agent: chat answers stream as server-sent events, so no buffering and a long read timeout
  location /api/agent/ {
    rewrite ^/api/agent/(.*)$ /$1 break;
    proxy_pass $agent;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header X-Request-ID $request_id;
    proxy_buffering off;
    proxy_read_timeout 600s;
  }
  location / { try_files $uri /index.html; }
}
