[project]
name = "notifier"
version = "0.1.0"
description = "Alerts for support: SLA at risk / breached, P1 tickets, escalations, AI approvals and handovers; on-call rota with escalation; e-mail, Teams, in-app."
requires-python = ">=3.14"
dependencies = [
    "mes-common",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.28",
    "pydantic-settings>=2.6",
    "alembic>=1.14",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/notifier"]
