[project]
name = "support-agent"
version = "0.1.0"
description = "AI support engineer for MES tickets: L1 triage/diagnosis/resolution and the operator chat, on Claude."
requires-python = ">=3.14"
dependencies = [
    "mes-common",
    "anthropic>=1.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.28",
    "pydantic-settings>=2.6",
    "alembic>=1.14",
    "mcp>=2.2",
    "cryptography>=50.0.1",
    "pypdf>=6.19.0",
    "python-multipart>=0.0.32",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/support_agent"]
