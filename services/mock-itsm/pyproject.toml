[project]
name = "mock-itsm"
version = "0.1.0"
description = "Headless fake ServiceNow (incidents) and Jira (issues) for the automated tests, each exposing an MCP server."
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "mcp>=2.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mock_itsm"]
