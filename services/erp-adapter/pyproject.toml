[project]
name = "erp-adapter"
version = "0.1.0"
description = "ERP integration service: SAP S/4HANA OData <-> MES canonical events, with idempotent, reconciling delivery."
requires-python = ">=3.14"
dependencies = [
    "mes-common",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.28",
    "pydantic-settings>=2.6",
    "alembic>=1.14",
]

[dependency-groups]
dev = ["mock-sap"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/erp_adapter"]
