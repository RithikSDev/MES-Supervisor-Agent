[project]
name = "mock-sap"
version = "0.1.0"
description = "Fake S/4HANA On-Prem OData V2 endpoints (PP production orders, confirmations, material documents) for demos and tests."
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mock_sap"]
