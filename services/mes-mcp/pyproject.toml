[project]
name = "mes-mcp"
version = "0.1.0"
description = "MCP server exposing MES (tickets, maintenance, work orders, genealogy, line status) to AI agents."
requires-python = ">=3.14"
dependencies = [
    "mcp>=2.2",
    "httpx>=0.28",
    "pydantic-settings>=2.6",
    "uvicorn[standard]>=0.32",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mes_mcp"]
