[project]
name = "itsm-adapter"
version = "0.1.0"
description = "ITSM integration service: MES support tickets <-> ServiceNow incidents and Jira issues, over MCP."
requires-python = ">=3.14"
dependencies = [
    "mes-common",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.28",
    "mcp>=2.2",
    "pydantic-settings>=2.6",
    "alembic>=1.14",
    "cryptography>=50.0.1",
]

[dependency-groups]
dev = ["mock-itsm"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/itsm_adapter"]
