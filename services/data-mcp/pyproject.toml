[project]
name = "data-mcp"
version = "0.1.0"
description = "Read-only MCP servers for AI support: the MES database (guarded SQL + ready-made queries) and SAP (OData APIs)."
requires-python = ">=3.14"
dependencies = [
    "mes-common",
    "mcp>=2.2",
    "asyncpg>=0.30",
    "httpx>=0.28",
    "pydantic-settings>=2.6",
    "uvicorn[standard]>=0.32",
]

[dependency-groups]
dev = ["mock-sap"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/data_mcp"]
