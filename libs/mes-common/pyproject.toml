[project]
name = "mes-common"
version = "0.1.0"
description = "Shared plumbing for MES services: event envelope, outbox/inbox, Kafka helpers, OIDC token verification."
requires-python = ">=3.14"
dependencies = [
    "pydantic>=2.10",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "aiokafka>=0.12",
    "pyjwt[crypto]>=2.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mes_common"]
